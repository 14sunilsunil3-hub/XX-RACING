<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XXRACING — Racing Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #32155c, #0c0616 75%);
      color: #f5f3ff;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .card {
      background: rgba(24, 13, 46, 0.94);
      border: 1px solid rgba(168, 85, 247, 0.45);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.68);
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .badge {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #f3e8ff;
      background: rgba(147, 51, 234, 0.28);
      border: 1px solid rgba(192, 132, 252, 0.4);
      padding: 6px 12px;
      border-radius: 999px;
    }

    .status {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #c084fc;
      text-transform: uppercase;
    }

    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13.5px;
      line-height: 1.5;
      color: #c4b5fd;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #e9d5ff;
      margin-bottom: 10px;
    }

    .cars-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .car-box {
      background: rgba(15, 8, 30, 0.88);
      border: 1px solid rgba(168, 85, 247, 0.28);
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
    }

    .car-box.active {
      border-color: #c084fc;
      background: rgba(109, 40, 217, 0.32);
      box-shadow: 0 8px 20px rgba(147, 51, 234, 0.28);
    }

    .car-name {
      display: block;
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .car-spec {
      display: block;
      font-size: 11.5px;
      color: #c4b5fd;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: rgba(15, 8, 30, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 12px;
      padding: 11px 8px;
      text-align: center;
    }

    .stat-value {
      display: block;
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 3px;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.7px;
      color: #a78bfa;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      border: none;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 13px 16px;
      border-radius: 12px;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #a855f7, #6d28d9);
      color: #ffffff;
    }

    .btn-secondary {
      background: transparent;
      color: #e9d5ff;
      border: 1px solid rgba(192, 132, 252, 0.4);
    }

    #admin-panel {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(15, 8, 30, 0.9);
      border: 1px solid rgba(192, 132, 252, 0.45);
    }

    .admin-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .admin-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #f3e8ff;
    }

    .admin-btn {
      background: rgba(147, 51, 234, 0.3);
      border: 1px solid rgba(192, 132, 252, 0.45);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .admin-list {
      font-size: 12px;
      color: #d8b4fe;
      line-height: 1.5;
    }

    .msg-box {
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 12.5px;
      line-height: 1.45;
      display: none;
      background: rgba(147, 51, 234, 0.22);
      border: 1px solid rgba(192, 132, 252, 0.45);
      color: #f3e8ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="top-row">
        <span class="badge">XXRACING</span>
        <span id="user-badge" class="status">PLAY BOY</span>
      </div>

      <h1>XXRACING</h1>
      <p class="subtitle">
        Select your machine, check live specs, and hit the track.
      </p>

      <div class="section-title">Select Car</div>
      <div class="cars-grid">
        <div
          id="car-hyper"
          class="car-box active"
          onclick="selectCar('Hyper GT', '365 KM/H', '9.8/10', 'Turbo V12')"
        >
          <span class="car-name">Hyper GT</span>
          <span class="car-spec">365 KM/H • Turbo V12</span>
        </div>

        <div
          id="car-phantom"
          class="car-box"
          onclick="selectCar('Phantom X', '345 KM/H', '9.4/10', 'Twin Nitro')"
        >
          <span class="car-name">Phantom X</span>
          <span class="car-spec">345 KM/H • Twin Nitro</span>
        </div>
      </div>

      <div class="stats">
        <div class="stat-box">
          <span id="stat-speed" class="stat-value">365 KM/H</span>
          <span class="stat-label">TOP SPEED</span>
        </div>
        <div class="stat-box">
          <span id="stat-handling" class="stat-value">9.8/10</span>
          <span class="stat-label">HANDLING</span>
        </div>
        <div class="stat-box">
          <span id="stat-engine" class="stat-value">Turbo V12</span>
          <span class="stat-label">ENGINE</span>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary" onclick="startRace()">Start Race</button>
        <button type="button" class="btn btn-secondary" onclick="logoutUser()">Logout</button>
      </div>

      <div id="admin-panel">
        <div class="admin-head">
          <span class="admin-title">Admin Control</span>
          <button type="button" class="admin-btn" onclick="loadAdminUsers()">View Users</button>
        </div>
        <div id="admin-list" class="admin-list">Admin session active (1122334455).</div>
      </div>

      <div id="msg-box" class="msg-box"></div>
    </div>
  </div>

  <script>
    var selectedCarName = "Hyper GT";

    fetch("/api/me")
      .then(function (res) {
        if (!res.ok) {
          window.location.replace("/auth.html");
          return null;
        }
        return res.json();
      })
      .then(function (data) {
        if (data && data.loggedIn && data.mobile) {
          var roleLabel = data.isAdmin ? "ADMIN: " : "ID: ";
          document.getElementById("user-badge").textContent = roleLabel + data.mobile;
          if (data.isAdmin) {
            document.getElementById("admin-panel").style.display = "block";
          }
        }
      })
      .catch(function () {
        window.location.replace("/auth.html");
      });

    function loadAdminUsers() {
      fetch("/api/admin/users")
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (!data.ok) {
            document.getElementById("admin-list").textContent = data.message || "Access denied.";
            return;
          }
          var rows = data.users.map(function (u) {
            return u.mobile + " (" + u.role + ")";
          });
          document.getElementById("admin-list").textContent =
            "Total Users: " + data.totalUsers + " — " + rows.join(", ");
        })
        .catch(function () {
          document.getElementById("admin-list").textContent = "Failed to load admin users.";
        });
    }

    function selectCar(name, speed, handling, engine) {
      selectedCarName = name;

      var hyperBox = document.getElementById("car-hyper");
      var phantomBox = document.getElementById("car-phantom");

      hyperBox.className = "car-box" + (name === "Hyper GT" ? " active" : "");
      phantomBox.className = "car-box" + (name === "Phantom X" ? " active" : "");

      document.getElementById("stat-speed").textContent = speed;
      document.getElementById("stat-handling").textContent = handling;
      document.getElementById("stat-engine").textContent = engine;

      var msgBox = document.getElementById("msg-box");
      msgBox.style.display = "none";
      msgBox.textContent = "";
    }

    function startRace() {
      var msgBox = document.getElementById("msg-box");
      msgBox.textContent = selectedCarName + " locked! Ready for race on XXRACING track.";
      msgBox.style.display = "block";
    }

    function logoutUser() {
      fetch("/api/logout", { method: "POST" })
        .then(function () {
          window.location.replace("/auth.html");
        })
        .catch(function () {
          window.location.replace("/auth.html");
        });
    }
  </script>
</body>
</html>
