<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XXRACING — Play Boy Access</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #32155c, #0c0616 75%);
      color: #f5f3ff;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: rgba(24, 13, 46, 0.94);
      border: 1px solid rgba(168, 85, 247, 0.45);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.65);
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    .badge {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #f3e8ff;
      background: rgba(147, 51, 234, 0.28);
      border: 1px solid rgba(192, 132, 252, 0.4);
      padding: 6px 12px;
      border-radius: 999px;
    }

    .status {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #c084fc;
      text-transform: uppercase;
    }

    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13.5px;
      line-height: 1.5;
      color: #c4b5fd;
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      background: rgba(15, 8, 30, 0.9);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #c4b5fd;
      font-size: 13.5px;
      font-weight: 700;
      padding: 12px 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #a855f7, #6d28d9);
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(147, 51, 234, 0.35);
    }

    .input-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #e9d5ff;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 11px;
      border: 1px solid rgba(168, 85, 247, 0.35);
      background: rgba(13, 7, 26, 0.92);
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    input::placeholder {
      color: #8b7ab8;
    }

    input:focus {
      border-color: #c084fc;
    }

    .otp-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .otp-row input {
      flex: 1;
    }

    .otp-btn {
      background: rgba(147, 51, 234, 0.28);
      color: #f3e8ff;
      border: 1px solid rgba(192, 132, 252, 0.45);
      border-radius: 11px;
      padding: 12px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .rule-hint {
      font-size: 11.5px;
      line-height: 1.45;
      color: #b794f4;
      margin-top: 6px;
      display: none;
    }

    #confirm-password-group {
      display: none;
    }

    .row-helper {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .link-btn {
      background: none;
      border: none;
      color: #d8b4fe;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .btn {
      width: 100%;
      border: none;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 13px 18px;
      border-radius: 12px;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #a855f7, #6d28d9);
      color: #ffffff;
    }

    .msg-box {
      margin-top: 16px;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 12.5px;
      line-height: 1.45;
      display: none;
      background: rgba(147, 51, 234, 0.22);
      border: 1px solid rgba(192, 132, 252, 0.45);
      color: #f3e8ff;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(6, 3, 14, 0.82);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-box {
      width: 100%;
      max-width: 410px;
      background: #180d2e;
      border: 1px solid rgba(192, 132, 252, 0.5);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
    }

    .close-btn {
      background: rgba(147, 51, 234, 0.25);
      border: 1px solid rgba(192, 132, 252, 0.35);
      color: #f3e8ff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-msg {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      display: none;
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(248, 113, 113, 0.45);
      color: #fecaca;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="top-row">
        <span class="badge">XXRACING</span>
        <span class="status">PLAY BOY ACCESS</span>
      </div>

      <h1>XXRACING</h1>
      <p class="subtitle">
        Sign in with your mobile number or register a new play boy account.
      </p>

      <div class="tabs">
        <button type="button" id="btn-login" class="tab-btn active" onclick="switchMode('login')">Login</button>
        <button type="button" id="btn-register" class="tab-btn" onclick="switchMode('register')">Register</button>
      </div>

      <form id="auth-form" onsubmit="submitForm(event)">
        <div class="input-group">
          <label for="mobile-input">Mobile Number</label>
          <input
            id="mobile-input"
            type="tel"
            inputmode="numeric"
            pattern="[0-9]{10}"
            maxlength="10"
            placeholder="Enter 10-digit mobile number"
            required
          />
        </div>

        <div class="input-group">
          <label id="password-label" for="password-input">Password</label>
          <input
            id="password-input"
            type="password"
            placeholder="Enter password"
            required
          />
          <p id="password-rule" class="rule-hint">
            Minimum 6 characters required.
          </p>
        </div>

        <div id="confirm-password-group" class="input-group">
          <label for="confirm-password-input">Confirm Password</label>
          <input
            id="confirm-password-input"
            type="password"
            placeholder="Confirm your password"
          />
        </div>

        <div id="forgot-row" class="row-helper">
          <button type="button" class="link-btn" onclick="openForgotPopup()">Forgot Password?</button>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary">Login</button>
      </form>

      <div id="msg-box" class="msg-box"></div>
    </div>
  </div>

  <div id="forgot-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">Reset Password</span>
        <button type="button" class="close-btn" onclick="closeForgotPopup()">&times;</button>
      </div>

      <form id="reset-form" onsubmit="submitResetPassword(event)">
        <div class="input-group">
          <label for="reset-mobile">Mobile Number</label>
          <input
            id="reset-mobile"
            type="tel"
            inputmode="numeric"
            pattern="[0-9]{10}"
            maxlength="10"
            placeholder="Enter 10-digit mobile number"
            required
          />
        </div>

        <div class="input-group">
          <label for="reset-otp">6-Digit OTP</label>
          <div class="otp-row">
            <input
              id="reset-otp"
              type="tel"
              inputmode="numeric"
              pattern="[0-9]{6}"
              maxlength="6"
              placeholder="Enter 6-digit OTP"
              required
            />
            <button type="button" class="otp-btn" onclick="sendDemoOtp()">Send OTP</button>
          </div>
        </div>

        <div class="input-group">
          <label for="reset-new-password">Create a Password</label>
          <input
            id="reset-new-password"
            type="password"
            minlength="6"
            placeholder="Create new password (min 6 chars)"
            required
          />
        </div>

        <div class="input-group">
          <label for="reset-confirm-password">Confirm Password</label>
          <input
            id="reset-confirm-password"
            type="password"
            minlength="6"
            placeholder="Confirm new password"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary">Reset Password</button>
      </form>

      <div id="modal-msg" class="modal-msg"></div>
    </div>
  </div>

  <script>
    var mode = "login";
    var generatedOtp = "";

    function switchMode(newMode) {
      mode = newMode;

      var btnLogin = document.getElementById("btn-login");
      var btnRegister = document.getElementById("btn-register");
      var passLabel = document.getElementById("password-label");
      var passInput = document.getElementById("password-input");
      var passRule = document.getElementById("password-rule");
      var confirmGroup = document.getElementById("confirm-password-group");
      var confirmInput = document.getElementById("confirm-password-input");
      var forgotRow = document.getElementById("forgot-row");
      var submitBtn = document.getElementById("submit-btn");
      var msgBox = document.getElementById("msg-box");

      if (mode === "register") {
        btnLogin.className = "tab-btn";
        btnRegister.className = "tab-btn active";
        passLabel.textContent = "Create Password";
        passInput.placeholder = "Create password (min 6 characters)";
        passRule.style.display = "block";
        confirmGroup.style.display = "block";
        confirmInput.required = true;
        forgotRow.style.display = "none";
        submitBtn.textContent = "Register";
      } else {
        btnLogin.className = "tab-btn active";
        btnRegister.className = "tab-btn";
        passLabel.textContent = "Password";
        passInput.placeholder = "Enter password";
        passRule.style.display = "none";
        confirmGroup.style.display = "none";
        confirmInput.required = false;
        confirmInput.value = "";
        forgotRow.style.display = "flex";
        submitBtn.textContent = "Login";
      }

      msgBox.style.display = "none";
      msgBox.textContent = "";
    }

    function showMsg(text) {
      var msgBox = document.getElementById("msg-box");
      msgBox.textContent = text;
      msgBox.style.display = "block";
    }

    function showModalError(text) {
      var modalMsg = document.getElementById("modal-msg");
      modalMsg.textContent = text;
      modalMsg.style.display = "block";
    }

    function openForgotPopup() {
      var currentMobile = document.getElementById("mobile-input").value.trim();
      var resetMobile = document.getElementById("reset-mobile");
      if (currentMobile) {
        resetMobile.value = currentMobile;
      }
      document.getElementById("reset-otp").value = "";
      document.getElementById("reset-new-password").value = "";
      document.getElementById("reset-confirm-password").value = "";
      document.getElementById("modal-msg").style.display = "none";
      document.getElementById("forgot-modal").style.display = "flex";
    }

    function closeForgotPopup() {
      document.getElementById("forgot-modal").style.display = "none";
    }

    function sendDemoOtp() {
      var mobile = document.getElementById("reset-mobile").value.trim();
      if (!/^[0-9]{10}$/.test(mobile)) {
        showModalError("Pehle valid 10-digit Mobile Number daalein.");
        return;
      }
      generatedOtp = String(Math.floor(100000 + Math.random() * 900000));
      document.getElementById("reset-otp").value = generatedOtp;
      showModalError("Demo OTP sent: " + generatedOtp + " (ab Reset Password dabayein).");
    }

    function submitResetPassword(e) {
      if (e && e.preventDefault) e.preventDefault();

      var mobile = document.getElementById("reset-mobile").value.trim();
      var otp = document.getElementById("reset-otp").value.trim();
      var newPass = document.getElementById("reset-new-password").value;
      var confirmPass = document.getElementById("reset-confirm-password").value;

      if (!/^[0-9]{10}$/.test(mobile)) {
        showModalError("Please enter a valid 10-digit mobile number.");
        return false;
      }
      if (!/^[0-9]{6}$/.test(otp)) {
        showModalError("Please enter a valid 6-digit OTP.");
        return false;
      }
      if (newPass.length < 6) {
        showModalError("Create a password kam se kam 6 characters ka hona chahiye.");
        return false;
      }
      if (newPass !== confirmPass) {
        showModalError("Create a password aur Confirm password match nahi kar rahe hain.");
        return false;
      }

      fetch("/api/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          mobile: mobile,
          otp: otp,
          newPassword: newPass,
          confirmPassword: confirmPass
        })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (!data.ok) {
            showModalError(data.message || "Reset failed.");
            return;
          }
          closeForgotPopup();
          switchMode("login");
          document.getElementById("mobile-input").value = mobile;
          document.getElementById("password-input").value = "";
          showMsg(data.message);
        })
        .catch(function () {
          showModalError("Server se connect nahi ho pa raha hai.");
        });

      return false;
    }

    function submitForm(e) {
      if (e && e.preventDefault) e.preventDefault();

      var mobile = document.getElementById("mobile-input").value.trim();
      var pw = document.getElementById("password-input").value;

      if (mode === "register") {
        var cpw = document.getElementById("confirm-password-input").value;

        if (pw.length < 6) {
          showMsg("Password kam se kam 6 characters ka hona chahiye.");
          return false;
        }
        if (pw !== cpw) {
          showMsg("Create Password aur Confirm Password match nahi kar rahe hain.");
          return false;
        }

        fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            mobile: mobile,
            password: pw,
            confirmPassword: cpw
          })
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (!data.ok) {
              showMsg(data.message || "Register failed.");
              return;
            }
            switchMode("login");
            document.getElementById("mobile-input").value = mobile;
            document.getElementById("password-input").value = "";
            showMsg(data.message);
          })
          .catch(function () {
            showMsg("Server se connect nahi ho pa raha hai.");
          });

        return false;
      }

      fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          mobile: mobile,
          password: pw
        })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (!data.ok) {
            showMsg(data.message || "Login failed.");
            return;
          }
          window.location.href = data.redirect || "/index.html";
        })
        .catch(function () {
          showMsg("Server se connect nahi ho pa raha hai.");
        });

      return false;
    }
  </script>
</body>
</html>
